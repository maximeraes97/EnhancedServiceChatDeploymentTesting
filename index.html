<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Service Chat Deployment Testing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="language-switcher">
      <label for="languageSelect">Language:</label>
      <select id="languageSelect">
        <option value="en_US">English</option>
        <option value="nl_NL">Nederlands</option>
        <option value="fr_FR">Français</option>
      </select>
    </div>
    <h1 data-i18n="title">Enhanced Service Chat Deployment Testing</h1>
    <p data-i18n="subtitle">A very basic sample site, hosted on GitHub Pages.</p>
  </header>

  <section id="loginSection" class="auth-section">
    <h2 data-i18n="loginHeading">Sign in for authorized chat</h2>
    <form id="loginForm">
      <label for="customerNumber" data-i18n="customerNumberLabel">Customer number</label>
      <input type="text" id="customerNumber" required />

      <label for="password" data-i18n="passwordLabel">Password</label>
      <input type="password" id="password" required />

      <button type="submit" data-i18n="loginButton">Log in</button>
      <p id="loginError" class="login-error" data-i18n="loginError" hidden>Invalid customer number or password.</p>
    </form>
  </section>

  <section id="authStatus" class="auth-section" hidden>
    <p>
      <span data-i18n="loggedInAs">Logged in as customer</span>
      <strong id="authCustomerNumber"></strong>
      — <a href="#" id="logoutLink" data-i18n="logoutButton">Log out</a>
    </p>
  </section>

  <main>
    <section>
      <h2 data-i18n="aboutHeading">About</h2>
      <p data-i18n="aboutBody">This page is a minimal static site used to test deployment via GitHub Pages.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Maxime Raes</p>
  </footer>

  <script type='text/javascript'>
	// Salesforce locale code (e.g. 'en_US') the hidden prechat field is named on the deployment.
	// Update these to match whatever Field Names you gave the Hidden Fields in
	// Setup > Embedded Service Deployments > GitHubSiteTestEmbedding > Customize Prechat.
	var LANGUAGE_FIELD_NAME = 'VisitorLanguage';
	var CUSTOMER_FIELD_NAME = 'CustomerNumber';

	var LANGUAGE_STORAGE_KEY = 'preferredLanguage';
	var AUTH_STORAGE_KEY = 'chatAuthenticated';
	var CUSTOMER_STORAGE_KEY = 'customerNumber';
	var DEFAULT_LANGUAGE = 'en_US';

	// Demo-only shared password, checked client-side. This is NOT real security — anyone
	// can read it in the page source or skip the form entirely via devtools. It only exists
	// to distinguish an "authorized" demo chat session from an anonymous one for testing.
	var DEMO_PASSWORD = 'welcome123';

	var bootstrapLoaded = false;
	var chatInitialized = false;

	var translations = {
		en_US: {
			title: 'Enhanced Service Chat Deployment Testing',
			subtitle: 'A very basic sample site, hosted on GitHub Pages.',
			aboutHeading: 'About',
			aboutBody: 'This page is a minimal static site used to test deployment via GitHub Pages.',
			loginHeading: 'Sign in for authorized chat',
			customerNumberLabel: 'Customer number',
			passwordLabel: 'Password',
			loginButton: 'Log in',
			loginError: 'Invalid customer number or password.',
			loggedInAs: 'Logged in as customer',
			logoutButton: 'Log out'
		},
		nl_NL: {
			title: 'Enhanced Service Chat Implementatietest',
			subtitle: 'Een zeer eenvoudige voorbeeldsite, gehost op GitHub Pages.',
			aboutHeading: 'Over',
			aboutBody: 'Deze pagina is een minimale statische site om de implementatie via GitHub Pages te testen.',
			loginHeading: 'Log in voor geautoriseerde chat',
			customerNumberLabel: 'Klantnummer',
			passwordLabel: 'Wachtwoord',
			loginButton: 'Inloggen',
			loginError: 'Ongeldig klantnummer of wachtwoord.',
			loggedInAs: 'Ingelogd als klant',
			logoutButton: 'Uitloggen'
		},
		fr_FR: {
			title: 'Test de déploiement du chat de service amélioré',
			subtitle: 'Un site exemple très basique, hébergé sur GitHub Pages.',
			aboutHeading: 'À propos',
			aboutBody: "Cette page est un site statique minimal utilisé pour tester le déploiement via GitHub Pages.",
			loginHeading: 'Connectez-vous pour le chat autorisé',
			customerNumberLabel: 'Numéro de client',
			passwordLabel: 'Mot de passe',
			loginButton: 'Se connecter',
			loginError: 'Numéro de client ou mot de passe invalide.',
			loggedInAs: 'Connecté en tant que client',
			logoutButton: 'Se déconnecter'
		}
	};

	function getStoredLanguage() {
		return localStorage.getItem(LANGUAGE_STORAGE_KEY) || DEFAULT_LANGUAGE;
	}

	function applyTranslations(language) {
		var strings = translations[language] || translations[DEFAULT_LANGUAGE];
		document.querySelectorAll('[data-i18n]').forEach(function (el) {
			var key = el.getAttribute('data-i18n');
			if (strings[key]) {
				el.textContent = strings[key];
			}
		});
		document.documentElement.lang = language.split('_')[0];
	}

	function isAuthenticated() {
		return sessionStorage.getItem(AUTH_STORAGE_KEY) === 'true';
	}

	function getStoredCustomerNumber() {
		return sessionStorage.getItem(CUSTOMER_STORAGE_KEY) || '';
	}

	function updateAuthUI() {
		var loginSection = document.getElementById('loginSection');
		var authStatus = document.getElementById('authStatus');
		if (isAuthenticated()) {
			loginSection.hidden = true;
			authStatus.hidden = false;
			document.getElementById('authCustomerNumber').textContent = getStoredCustomerNumber();
		} else {
			loginSection.hidden = false;
			authStatus.hidden = true;
		}
	}

	function doInitEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = getStoredLanguage();

			embeddedservice_bootstrap.init(
				'00DS800000IrLNL',
				'GitHubSiteTestEmbedding',
				'https://th-group--qa.sandbox.my.site.com/ESWGitHubSiteTest1790782172474',
				{
					scrt2URL: 'https://th-group--qa.sandbox.my.salesforce-scrt.com'
				}
			);

			// Hidden prechat fields are only settable once the widget has finished bootstrapping.
			window.addEventListener('onEmbeddedMessagingReady', function () {
				var hiddenFields = {};
				hiddenFields[LANGUAGE_FIELD_NAME] = getStoredLanguage();
				hiddenFields[CUSTOMER_FIELD_NAME] = getStoredCustomerNumber();
				embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields(hiddenFields);
			});
		} catch (err) {
			console.error('Error loading Embedded Messaging: ', err);
		}
	}

	// Only authorized (logged in) visitors get the chat widget at all.
	function tryInitChat() {
		if (bootstrapLoaded && isAuthenticated() && !chatInitialized) {
			chatInitialized = true;
			doInitEmbeddedMessaging();
		}
	}

	function initEmbeddedMessaging() {
		bootstrapLoaded = true;
		tryInitChat();
	};

	document.addEventListener('DOMContentLoaded', function () {
		var storedLanguage = getStoredLanguage();
		applyTranslations(storedLanguage);
		updateAuthUI();

		var select = document.getElementById('languageSelect');
		select.value = storedLanguage;
		select.addEventListener('change', function () {
			localStorage.setItem(LANGUAGE_STORAGE_KEY, select.value);
			// Reload so the embedded messaging widget re-initializes with the new language,
			// since embeddedservice_bootstrap.settings.language can only be set before init().
			location.reload();
		});

		document.getElementById('loginForm').addEventListener('submit', function (event) {
			event.preventDefault();
			var customerNumber = document.getElementById('customerNumber').value.trim();
			var password = document.getElementById('password').value;
			var errorEl = document.getElementById('loginError');

			if (customerNumber && password === DEMO_PASSWORD) {
				sessionStorage.setItem(AUTH_STORAGE_KEY, 'true');
				sessionStorage.setItem(CUSTOMER_STORAGE_KEY, customerNumber);
				errorEl.hidden = true;
				updateAuthUI();
				tryInitChat();
			} else {
				errorEl.hidden = false;
			}
		});

		document.getElementById('logoutLink').addEventListener('click', function (event) {
			event.preventDefault();
			sessionStorage.removeItem(AUTH_STORAGE_KEY);
			sessionStorage.removeItem(CUSTOMER_STORAGE_KEY);
			// Reload so an anonymous visitor no longer has an initialized (authorized) chat widget.
			location.reload();
		});
	});
</script>
<script type='text/javascript' src='https://th-group--qa.sandbox.my.site.com/ESWGitHubSiteTest1790782172474/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
</body>
</html>
